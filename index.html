<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}img{max-width:100%}</style>
<title>추가지문 단어 퀴즈</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Sora:wght@600;700&display=swap">
<style>
/* Layout: 한 화면에 한 문제씩 보여주는 좁은 단일 컬럼 카드 (폰 우선), 시작 → 문제 → 결과 3개 화면 전환 */
:root {
  --bg: #F3F6FB;
  --surface: #FFFFFF;
  --fg: #16213A;
  --muted: #62708C;
  --line: #D8E0ED;
  --accent: #2457C5;
  --accent-ink: #FFFFFF;
  --accent-soft: #E6EEFC;
  --ok: #11774A;
  --ok-bg: #E2F4EB;
  --bad: #B3261E;
  --bad-bg: #FBE6E4;
  --font-body: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-word: "Sora", "Noto Sans KR", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1527;
    --surface: #162038;
    --fg: #E8EDF8;
    --muted: #94A1BC;
    --line: #2A3652;
    --accent: #7FA6FF;
    --accent-ink: #0E1527;
    --accent-soft: #1C2B4D;
    --ok: #5ED39B;
    --ok-bg: #123428;
    --bad: #FF8F86;
    --bad-bg: #3B1B20;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1527;
  --surface: #162038;
  --fg: #E8EDF8;
  --muted: #94A1BC;
  --line: #2A3652;
  --accent: #7FA6FF;
  --accent-ink: #0E1527;
  --accent-soft: #1C2B4D;
  --ok: #5ED39B;
  --ok-bg: #123428;
  --bad: #FF8F86;
  --bad-bg: #3B1B20;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
}
.wrap {
  max-width: 560px;
  margin-inline: auto;
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
.brand b { font-family: var(--font-word); font-size: 15px; letter-spacing: .04em; color: var(--accent); }
.brand span { font-size: 13px; color: var(--muted); }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 22px 20px;
}
.stack { display: flex; flex-direction: column; gap: 22px; }

/* start */
h1 { font-size: 26px; line-height: 1.25; font-weight: 700; text-wrap: balance; }
.lead { color: var(--muted); font-size: 15px; margin-top: 6px; }
.label { font-size: 12.5px; font-weight: 700; letter-spacing: .06em; color: var(--muted); margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 999px;
  padding: 8px 14px;
  font-size: 14.5px;
  min-height: 40px;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.chip:disabled { opacity: .45; cursor: not-allowed; }
.count { font-variant-numeric: tabular-nums; opacity: .8; margin-left: 4px; font-size: 13px; }
.primary {
  width: 100%;
  background: var(--accent);
  color: var(--accent-ink);
  border: 0;
  border-radius: 12px;
  padding: 15px 18px;
  font-size: 17px;
  font-weight: 700;
}
.ghost {
  width: 100%;
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 13px 18px;
  font-size: 15.5px;
}
.hint { font-size: 13px; color: var(--muted); }

/* quiz */
.progress { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .25s ease; }
.ask { font-size: 13.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.pos { font-size: 12px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 1px 7px; }
.prompt {
  font-family: var(--font-word);
  font-size: clamp(28px, 8.5vw, 38px);
  line-height: 1.2;
  font-weight: 700;
  margin-top: 10px;
  overflow-wrap: anywhere;
  text-wrap: balance;
}
.prompt.ko { font-family: var(--font-body); font-size: clamp(24px, 7vw, 30px); }
.options { display: grid; gap: 10px; margin-top: 22px; }
.opt {
  display: flex; align-items: center; gap: 12px;
  text-align: left;
  width: 100%;
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 12px;
  padding: 13px 14px;
  min-height: 54px;
  font-size: 16.5px;
}
.opt .n {
  flex: none; width: 26px; height: 26px; border-radius: 8px;
  display: grid; place-items: center;
  font-size: 13px; font-weight: 700; color: var(--muted);
  border: 1px solid var(--line);
  font-variant-numeric: tabular-nums;
}
.opt .t { min-width: 0; overflow-wrap: anywhere; }
@media (hover: hover) { .opt:not(:disabled):hover { border-color: var(--accent); } }
.opt.ok { background: var(--ok-bg); border-color: var(--ok); }
.opt.ok .n { background: var(--ok); border-color: var(--ok); color: var(--bg); }
.opt.no { background: var(--bad-bg); border-color: var(--bad); }
.opt.no .n { background: var(--bad); border-color: var(--bad); color: var(--bg); }
.opt:disabled { cursor: default; }
.opt:disabled:not(.ok):not(.no) { opacity: .55; }
.feedback { min-height: 52px; margin-top: 16px; font-size: 15px; }
.feedback b { font-weight: 700; }
.feedback .good { color: var(--ok); }
.feedback .bad { color: var(--bad); }
.feedback .pair { font-family: var(--font-word); font-size: 14px; display: block; margin-top: 2px; color: var(--fg); }

/* spelling */
.spell { display: grid; gap: 12px; margin-top: 22px; }
.blanks { font-family: var(--font-word); font-size: 20px; letter-spacing: .08em; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; min-height: 30px; }
.spell input[type="text"] { width: 100%; font: inherit; font-family: var(--font-word); font-size: 20px; padding: 13px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); }
.spell input[type="text"]:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-color: var(--accent); }
.spell input.ok { border-color: var(--ok); background: var(--ok-bg); }
.spell input.no { border-color: var(--bad); background: var(--bad-bg); }
.spell-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.spell-row .ghost, .spell-row .primary { padding-block: 13px; }
.prompt.list { font-size: clamp(20px, 5.6vw, 26px); line-height: 1.4; }
.mine { display: block; margin-top: 2px; font-size: 14px; color: var(--muted); }

.ghost.menu { width: auto; padding: 8px 14px; font-size: 14px; margin-bottom: 12px; }

/* result */
.score { font-family: var(--font-word); font-size: 54px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.score small { font-size: 22px; color: var(--muted); font-weight: 600; margin-left: 4px; }
.msg { margin-top: 10px; font-size: 16px; }
.wrong-list { margin: 0; padding: 0; list-style: none; display: grid; }
.wrong-list li { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
.wrong-list li:first-child { border-top: 0; }
.wrong-list .w { font-family: var(--font-word); font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
.wrong-list .m { font-size: 15px; overflow-wrap: anywhere; }
.btns { display: grid; gap: 10px; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>


</head>
<body>
<div class="wrap">
  <div class="brand"><b>추가지문</b><span>수능 필수 어휘 121개</span></div>

  <section id="s-start" class="stack">
    <div class="card stack">
      <div>
        <h1>뜻 테스트</h1>
        <p class="lead">4개 중에 하나 골라서 풀고, 틀린 단어는 따로 모아서 다시 풀 수 있어.</p>
      </div>
      <div>
        <div class="label">유형</div>
        <div class="chips" id="mode-chips" role="group" aria-label="유형">
          <button class="chip" type="button" data-mode="choice" aria-pressed="true">뜻 4지선다</button>
          <button class="chip" type="button" data-mode="spell" aria-pressed="false">스펠링 쓰기</button>
          <button class="chip" type="button" data-mode="syn" aria-pressed="false">동의어</button>
          <button class="chip" type="button" data-mode="ant" aria-pressed="false">반의어</button>
        </div>
      </div>
      <div id="level-box" hidden>
        <div class="label">난이도</div>
        <div class="chips" role="group" aria-label="난이도">
          <button class="chip" type="button" data-level="all" aria-pressed="true">목록 전체</button>
          <button class="chip" type="button" data-level="one" aria-pressed="false">하나씩 (고난도)</button>
        </div>
      </div>
      <div>
        <div class="label">범위</div>
        <div class="chips" id="range-chips" role="group" aria-label="범위"></div>
      </div>
      <div id="dir-box">
        <div class="label">문제 방식</div>
        <div class="chips" id="dir-chips" role="group" aria-label="문제 방식">
          <button class="chip" type="button" data-dir="en2ko" aria-pressed="true">영어 보고 뜻 고르기</button>
          <button class="chip" type="button" data-dir="ko2en" aria-pressed="false">뜻 보고 영어 고르기</button>
        </div>
      </div>
      <button class="primary" id="start" type="button">시작하기</button>
      <button class="ghost" id="reset-wrong" type="button">틀린 단어 기록 지우기</button>
      <p class="hint">뜻·동의어·반의어는 키보드 숫자로 답할 수 있어. 스펠링은 대소문자 상관없이 Enter로 확인해. 틀린 단어 기록은 유형별로 따로 저장돼.</p>
    </div>
  </section>

  <section id="s-quiz" hidden>
    <button class="ghost menu" id="menu" type="button">← 메뉴로</button>
    <div class="progress">
      <span id="pg-text">1 / 121</span>
      <div class="bar" role="progressbar" aria-label="진행률" aria-valuemin="0" aria-valuemax="100" id="pg-bar"><i id="pg-fill"></i></div>
      <span id="pg-score">맞힘 0</span>
    </div>
    <div class="card">
      <div class="ask"><span id="ask-text">뜻을 골라봐</span><span class="pos" id="pos" hidden></span></div>
      <p class="prompt" id="prompt"></p>
      <div class="options" id="options"></div>
      <form class="spell" id="spell" hidden autocomplete="off">
        <div class="blanks" id="blanks" aria-label="글자 수 힌트"></div>
        <input id="spell-in" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="영어 스펠링 입력" placeholder="영어로 써봐">
        <div class="spell-row">
          <button class="ghost" id="hint" type="button">첫 글자 힌트</button>
          <button class="primary" id="check" type="submit">확인</button>
        </div>
        <button class="ghost" id="skip" type="button">알고 있어, 넘어가기 (맞음 처리)</button>
      </form>
      <div class="feedback" id="feedback" aria-live="polite"></div>
      <button class="primary" id="next" type="button" hidden>다음</button>
    </div>
  </section>

  <section id="s-result" hidden class="stack">
    <div class="card">
      <div class="score"><span id="r-score">0</span><small id="r-total">/ 121</small></div>
      <p class="msg" id="r-msg"></p>
    </div>
    <div class="card" id="r-wrong-card">
      <div class="label" id="r-wrong-label">틀린 단어</div>
      <ul class="wrong-list" id="r-wrong"></ul>
    </div>
    <div class="btns">
      <button class="primary" id="retry-wrong" type="button">틀린 것만 다시 풀기</button>
      <button class="ghost" id="retry-same" type="button">같은 범위 다시 풀기</button>
      <button class="ghost" id="to-start" type="button">처음으로</button>
    </div>
  </section>
</div>

const $ = (id) => document.getElementById(id);
let mode = "choice";
const KEYS = { choice: "extra-wrong-words", spell: "extra-wrong-spell", syn: "extra-wrong-syn", ant: "extra-wrong-ant", synh: "extra-wrong-syn-hard", anth: "extra-wrong-ant-hard" };
let hard = false;
const isHard = () => hard && (mode === "syn" || mode === "ant");
const keyNow = () => KEYS[mode + (isHard() ? "h" : "")];
function loadWrong() { try { const a = JSON.parse(localStorage.getItem(keyNow()) || "[]"); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
function saveWrong(a) { try { localStorage.setItem(keyNow(), JSON.stringify(a)); } catch (e) {} }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

let dir = "en2ko", rangeId = "all";
let quiz = [], idx = 0, score = 0, wrongNow = [], locked = false, current = null;

const SECTIONS = ["Lesson 3", "Lesson 4", "① Honeybee", "② Recent Jobs", "③ Victor Hugo Green", "④ Factory Farms", "⑤ Blood Transfusion", "⑥ Space Junk"];
const RANGES = [
  { id: "all", label: "전체", pick: () => WORDS },
  ...SECTIONS.map((label, i) => ({ id: "s" + i, label, pick: () => WORDS.filter((x) => x.sec === i) })),
  { id: "wrong", label: "틀린 단어", pick: () => { const s = new Set(loadWrong()); return WORDS.filter((x) => s.has(x.w)); } },
];

RANGES.forEach((r) => { const base = r.pick; r.pick = () => { const l = base(); return mode === "syn" ? l.filter((x) => x.syn.length) : mode === "ant" ? l.filter((x) => x.ant.length) : l; }; });

const qCount = (list) => (isHard() ? list.reduce((a, x) => a + (mode === "syn" ? x.syn.length : x.ant.length), 0) : list.length);

function renderRanges() {
  const box = $("range-chips");
  box.textContent = "";
  RANGES.forEach((r) => {
    const n = qCount(r.pick());
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.dataset.id = r.id;
    b.setAttribute("aria-pressed", String(r.id === rangeId));
    b.disabled = n === 0;
    b.append(r.label);
    const c = document.createElement("span"); c.className = "count"; c.textContent = n; b.append(c);
    box.append(b);
  });
  if (RANGES.find((r) => r.id === rangeId).pick().length === 0) { rangeId = "all"; renderRanges(); }
}

$("range-chips").addEventListener("click", (e) => {
  const b = e.target.closest(".chip"); if (!b || b.disabled) return;
  rangeId = b.dataset.id; renderRanges();
});
$("dir-chips").addEventListener("click", (e) => {
  const b = e.target.closest(".chip"); if (!b) return;
  dir = b.dataset.dir;
  $("dir-chips").querySelectorAll(".chip").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
});

let snapshot = [];
$("menu").addEventListener("click", () => {
  saveWrong(snapshot);
  wrongNow = []; score = 0; idx = 0;
  renderRanges(); show("s-start");
});
let resetArmed = false, resetTimer = 0;
$("reset-wrong").addEventListener("click", () => {
  const b = $("reset-wrong");
  clearTimeout(resetTimer);
  if (!resetArmed) {
    resetArmed = true;
    b.textContent = "정말 지울까? 한 번 더 누르면 삭제돼";
    resetTimer = setTimeout(() => { resetArmed = false; b.textContent = "틀린 단어 기록 지우기"; }, 4000);
    return;
  }
  resetArmed = false;
  try { Object.values(KEYS).forEach((k) => localStorage.removeItem(k)); } catch (e) {}
  b.textContent = "기록을 지웠어";
  resetTimer = setTimeout(() => { b.textContent = "틀린 단어 기록 지우기"; }, 2000);
  renderRanges();
});
$("level-box").addEventListener("click", (e) => {
  const b = e.target.closest(".chip"); if (!b) return;
  hard = b.dataset.level === "one";
  $("level-box").querySelectorAll(".chip").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  renderRanges();
});
$("mode-chips").addEventListener("click", (e) => {
  const b = e.target.closest(".chip"); if (!b) return;
  mode = b.dataset.mode;
  $("mode-chips").querySelectorAll(".chip").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  $("dir-box").hidden = mode !== "choice";
  $("level-box").hidden = mode !== "syn" && mode !== "ant";
  renderRanges();
});

function show(id) { ["s-start", "s-quiz", "s-result"].forEach((s) => ($(s).hidden = s !== id)); window.scrollTo(0, 0); }

function begin(list) {
  if (isHard()) list = list.flatMap((x) => (x.shown ? [x] : (mode === "syn" ? x.syn : x.ant).map((it) => ({ ...x, shown: it }))));
  quiz = shuffle(list); idx = 0; score = 0; wrongNow = []; snapshot = loadWrong();
  show("s-quiz"); renderQ();
}

function optionText(x) { return dir === "en2ko" ? x.m : x.w; }

function renderRel() {
  const kind = mode;
  const own = kind === "syn" ? current.syn : current.ant;
  $("ask-text").textContent = isHard() ? (kind === "syn" ? "이 동의어에 해당하는 단어를 골라봐" : "이 반의어에 해당하는 단어를 골라봐") : (kind === "syn" ? "이 동의어들에 해당하는 단어를 골라봐" : "이 반의어들에 해당하는 단어를 골라봐");
  $("pos").hidden = true;
  const pr = $("prompt"); pr.textContent = isHard() ? current.shown : own.join(", "); pr.classList.remove("ko"); pr.classList.toggle("list", !isHard());
  const lc = (t) => t.toLowerCase();
  const mine = new Set([current.w, ...current.syn, ...current.ant].map(lc));
  const cand = WORDS.filter((x) => {
    if (x.w === current.w || x.m === current.m) return false;
    if (mine.has(lc(x.w))) return false;
    return !x.syn.concat(x.ant).some((y) => mine.has(lc(y)));
  });
  const picks = shuffle(cand).slice(0, 4);
  const opts = shuffle([{ text: current.w, ok: true }, ...picks.map((x) => ({ text: x.w, ok: false }))]);
  const box = $("options"); box.textContent = "";
  opts.forEach((o, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "opt"; b.dataset.correct = o.ok ? "1" : "0";
    const n = document.createElement("span"); n.className = "n"; n.textContent = i + 1;
    const t = document.createElement("span"); t.className = "t"; t.textContent = o.text;
    b.append(n, t);
    b.addEventListener("click", () => answer(b));
    box.append(b);
  });
  $("feedback").textContent = "";
  $("next").hidden = true;
}

function renderQ() {
  current = quiz[idx]; locked = false;
  $("pg-text").textContent = (idx + 1) + " / " + quiz.length;
  $("pg-score").textContent = "맞힘 " + score;
  const pct = Math.round((idx / quiz.length) * 100);
  $("pg-fill").style.width = pct + "%";
  $("pg-bar").setAttribute("aria-valuenow", pct);
  $("ask-text").textContent = dir === "en2ko" ? "뜻을 골라봐" : "영어 단어를 골라봐";
  const pos = $("pos");
  if (current.p) { pos.textContent = current.p; pos.hidden = false; } else { pos.hidden = true; }
  const pr = $("prompt");
  pr.textContent = dir === "en2ko" ? current.w : current.m;
  pr.classList.toggle("ko", dir === "ko2en"); pr.classList.remove("list");
  $("spell").hidden = mode !== "spell";
  $("options").hidden = mode === "spell";
  if (mode === "spell") {
    pr.textContent = current.m; pr.classList.add("ko");
    $("ask-text").textContent = "영어 스펠링을 써봐";
    setupSpell();
    return;
  }

  if (mode === "syn" || mode === "ant") { renderRel(); return; }

  const others = WORDS.filter((x) => x !== current && (dir === "en2ko" || x.m !== current.m));
  const pool = shuffle(others.filter((x) => x.p === current.p)).concat(shuffle(others.filter((x) => x.p !== current.p)));
  const seen = new Set([optionText(current)]);
  const picks = [];
  for (const x of pool) { const t = optionText(x); if (!seen.has(t)) { seen.add(t); picks.push(x); } if (picks.length === 3) break; }
  const opts = shuffle([current, ...picks]);

  const box = $("options"); box.textContent = "";
  opts.forEach((x, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "opt"; b.dataset.correct = x === current ? "1" : "0";
    const n = document.createElement("span"); n.className = "n"; n.textContent = i + 1;
    const t = document.createElement("span"); t.className = "t"; t.textContent = optionText(x);
    b.append(n, t);
    b.addEventListener("click", () => answer(b));
    box.append(b);
  });
  $("feedback").textContent = "";
  $("next").hidden = true;
}

function answer(btn) {
  if (locked) return; locked = true;
  const ok = btn.dataset.correct === "1";
  const all = $("options").querySelectorAll(".opt");
  all.forEach((b) => { b.disabled = true; if (b.dataset.correct === "1") b.classList.add("ok"); });
  if (!ok) btn.classList.add("no");

  const saved = new Set(loadWrong());
  if (ok) { score++; saved.delete(current.w); } else { wrongNow.push(current); saved.add(current.w); }
  saveWrong([...saved]);
  $("pg-score").textContent = "맞힘 " + score;

  const fb = $("feedback"); fb.textContent = "";
  const head = document.createElement("b"); head.className = ok ? "good" : "bad"; head.textContent = ok ? "정답!" : "아쉽다, 다시 기억해보자.";
  const pair = document.createElement("span"); pair.className = "pair"; pair.textContent = current.w + (current.p ? " (" + current.p + ")" : "") + "  =  " + current.m;
  if (mode === "syn" || mode === "ant") {
    const rel = document.createElement("span"); rel.className = "mine";
    rel.textContent = "동의어: " + (current.syn.join(", ") || "-") + "  /  반의어: " + (current.ant.join(", ") || "-");
    fb.append(head, pair, rel);
  } else { fb.append(head, pair); }

  const nx = $("next");
  nx.textContent = idx + 1 === quiz.length ? "결과 보기" : "다음";
  nx.hidden = false; nx.focus();
}

const answerOf = (x) => x.w.replace(/~/g, "").replace(/\s+/g, " ").trim();
const acceptable = (x) => WORDS.filter((y) => y.m === x.m && y.p === x.p).map(answerOf);
const norm = (s) => s.toLowerCase().replace(/[-‐–]/g, " ").replace(/\s+/g, " ").trim();
function blanksText(first) {
  return [...answerOf(current)].map((ch, i) => (ch === " " || ch === "-" ? ch : i === 0 && first ? ch : "_")).join(" ");
}
function setupSpell() {
  const inp = $("spell-in");
  inp.value = ""; inp.disabled = false; inp.className = "";
  $("blanks").textContent = blanksText(false);
  $("hint").disabled = false; $("hint").hidden = false; $("check").hidden = false; $("skip").hidden = false;
  $("feedback").textContent = ""; $("next").hidden = true;
  inp.focus();
}
$("hint").addEventListener("click", () => {
  $("blanks").textContent = blanksText(true); $("hint").disabled = true; $("spell-in").focus();
});
$("spell").addEventListener("submit", (e) => {
  e.preventDefault();
  if (locked) return;
  const inp = $("spell-in"); const val = inp.value;
  if (!val.trim()) return;
  locked = true;
  const ok = acceptable(current).some((a) => norm(val) === norm(a));
  inp.disabled = true; inp.classList.add(ok ? "ok" : "no");
  $("hint").hidden = true; $("check").hidden = true; $("skip").hidden = true;
  const saved = new Set(loadWrong());
  if (ok) { score++; saved.delete(current.w); } else { wrongNow.push(current); saved.add(current.w); }
  saveWrong([...saved]);
  $("pg-score").textContent = "맞힘 " + score;
  $("blanks").textContent = answerOf(current);
  const fb = $("feedback"); fb.textContent = "";
  const head = document.createElement("b"); head.className = ok ? "good" : "bad"; head.textContent = ok ? "정답!" : "아쉽다, 스펠링을 다시 확인해봐.";
  const pair = document.createElement("span"); pair.className = "pair"; pair.textContent = answerOf(current) + (current.p ? " (" + current.p + ")" : "") + "  =  " + current.m;
  fb.append(head, pair);
  if (!ok) { const mine = document.createElement("span"); mine.className = "mine"; mine.textContent = "내 답: " + val.trim(); fb.append(mine); }
  const nx = $("next");
  nx.textContent = idx + 1 === quiz.length ? "결과 보기" : "다음";
  nx.hidden = false; nx.focus();
});

$("skip").addEventListener("click", () => {
  if (locked) return;
  locked = true;
  const inp = $("spell-in");
  inp.value = answerOf(current); inp.disabled = true; inp.classList.add("ok");
  $("hint").hidden = true; $("check").hidden = true; $("skip").hidden = true;
  const saved = new Set(loadWrong());
  score++; saved.delete(current.w); saveWrong([...saved]);
  $("pg-score").textContent = "맞힘 " + score;
  $("blanks").textContent = answerOf(current);
  const fb = $("feedback"); fb.textContent = "";
  const head = document.createElement("b"); head.className = "good"; head.textContent = "알고 있는 단어라서 맞음 처리했어.";
  const pair = document.createElement("span"); pair.className = "pair"; pair.textContent = answerOf(current) + (current.p ? " (" + current.p + ")" : "") + "  =  " + current.m;
  fb.append(head, pair);
  const nx = $("next");
  nx.textContent = idx + 1 === quiz.length ? "결과 보기" : "다음";
  nx.hidden = false; nx.focus();
});

$("next").addEventListener("click", () => {
  if (idx + 1 >= quiz.length) return finish();
  idx++; renderQ();
});

function finish() {
  show("s-result");
  $("r-score").textContent = score;
  $("r-total").textContent = "/ " + quiz.length;
  const r = score / quiz.length;
  $("r-msg").textContent = r === 1 ? "전부 맞혔어! 완벽해." : r >= 0.8 ? "거의 다 외웠네. 틀린 것만 한 번 더 보면 끝이야." : r >= 0.5 ? "절반은 넘었어. 틀린 단어만 다시 풀어보자." : "아직 낯선 단어가 많아. 단어장 한 번 훑고 다시 도전해봐.";
  const list = $("r-wrong"); list.textContent = "";
  $("r-wrong-card").hidden = wrongNow.length === 0;
  $("r-wrong-label").textContent = "틀린 단어 " + wrongNow.length + "개";
  wrongNow.forEach((x) => {
    const li = document.createElement("li");
    const w = document.createElement("span"); w.className = "w"; w.textContent = x.w;
    const m = document.createElement("span"); m.className = "m"; m.textContent = (x.p ? x.p + " " : "") + x.m;
    li.append(w, m); list.append(li);
  });
  $("retry-wrong").hidden = wrongNow.length === 0;
  $("pg-fill").style.width = "100%";
}

$("start").addEventListener("click", () => {
  const list = RANGES.find((r) => r.id === rangeId).pick();
  if (list.length) begin(list);
});
$("retry-wrong").addEventListener("click", () => begin(wrongNow));
$("retry-same").addEventListener("click", () => begin(RANGES.find((r) => r.id === rangeId).pick()));
$("to-start").addEventListener("click", () => { renderRanges(); show("s-start"); });

document.addEventListener("keydown", (e) => {
  if ($("s-quiz").hidden || mode === "spell") return;
  if (!locked && e.key >= "1" && e.key <= "5") {
    const b = $("options").querySelectorAll(".opt")[Number(e.key) - 1];
    if (b) b.click();
  }
});

renderRanges();
</script>
